[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamify"
version = "0.1.0"
description = "A lightweight frontend for Streamlink and MPV"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video :: Display",
]
# Defines dependencies that xbps/pip will check
dependencies = [
    "PyQt5",
    "streamlink"
]

# This tells Python to generate a launcher binary named 'streamify' in /usr/bin/
[project.gui-scripts]
streamify = "streamify.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamify*"]

# CRITICAL: This ensures your custom CSS files are bundled inside the package
[tool.setuptools.package-data]
"streamify.ui.styles" = ["*.css"]
